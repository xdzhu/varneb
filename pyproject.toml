[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "varneb"
version = "0.0.1"
description = "VARiable-cell Nudged Elastic Band code with universal first-principles calculators"
readme = "README_VCNEB.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "VARNEB developers"}]
dependencies = [
  "ase>=3.22",
  "numpy>=1.22",
]

[project.urls]
Homepage = "https://github.com/xdzhu/varneb"
Repository = "https://github.com/xdzhu/varneb"
Issues = "https://github.com/xdzhu/varneb/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
varneb = "vcneb.cli:main"
vcneb = "vcneb.cli:main"

[tool.setuptools.packages.find]
include = ["vcneb*"]
