name: Publish VARNEB to PyPI

on:
  # Publishing is deliberate: either publish a GitHub Release or explicitly
  # run this workflow with publish=true. Ordinary pushes never publish.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Confirm that this run should publish the package to PyPI"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: varneb-dist
          path: dist/

  publish:
    needs: build
    if: ${{ github.event_name == 'release' || inputs.publish == true }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/varneb
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: varneb-dist
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
